version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mission_control
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/mission_control
      PORT: 3001
      NODE_ENV: development
      HEALTH_CHECK_INTERVAL_MS: 300000
      HEALTH_CHECK_TIMEOUT_MS: 5000
      FRONTEND_ORIGIN: http://localhost:5173
      AGENT_NEXUS_HEALTH_URL: http://localhost:4001/health
      AGENT_CIPHER_HEALTH_URL: http://localhost:4002/health
      AGENT_RELAY_HEALTH_URL: http://localhost:4003/health
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres_data:
